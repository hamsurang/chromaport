name: Bug Report
description: Report a bug in chromaport.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what happened.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps to reproduce the issue.
        Include the command you ran and any relevant theme/editor info.
      placeholder: |
        1. Run `chromaport --editor cursor --target ghostty`
        2. Select theme "..."
        3. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: chromaport version
      placeholder: "paste output of `chromaport --version`"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g., macOS 15.3, Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: editor
    attributes:
      label: Source editor
      options:
        - VS Code
        - Cursor
        - OpenCode
        - N/A

  - type: dropdown
    id: target
    attributes:
      label: Target app
      options:
        - Superset
        - Warp
        - Ghostty
        - Obsidian
        - OpenCode
        - N/A
