[package]
name = "chromaport"
version = "0.12.0"
edition = "2021"
description = "Migrate VS Code / Cursor / OpenCode / iTerm2 themes to Superset, Warp, Ghostty, OpenCode, Obsidian, iTerm2, WezTerm, and more"
license = "MIT"
repository = "https://github.com/hamsurang/chromaport"
homepage = "https://github.com/hamsurang/chromaport"
keywords = ["theme", "terminal", "color-scheme", "vscode", "converter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "chromaport"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
# NOTE: inquire 0.7 depends on crossterm 0.25, while ratatui uses crossterm 0.28.
# These two versions coexist safely because inquire prompts complete before the
# ratatui TUI starts, and TerminalGuard defensively resets terminal state.
inquire = "0.7"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
similar = { version = "2", features = ["inline"] }
console = "0.16"
crossterm = "0.28"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
ratatui = "0.29"
plist = "1"
semver = "1"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"

[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "hamsurang/homebrew-chromaport"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
