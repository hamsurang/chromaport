[package]
name = "chromaport"
version = "0.1.0"
edition = "2021"
description = "Migrate VS Code / Cursor themes to Superset, Warp, and more"
license = "MIT"
repository = "https://github.com/hamsurang/chromaport"
homepage = "https://github.com/hamsurang/chromaport"
keywords = ["theme", "vscode", "cursor", "superset", "warp"]

[[bin]]
name = "chromaport"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
inquire = "0.7"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["homebrew"]
tap = "hamsurang/homebrew-chromaport"
publish-jobs = ["homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
